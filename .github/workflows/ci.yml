name: ci

on:
  pull_request:
  push:
    branches: [main]
  # terraform-lock が GITHUB_TOKEN で入れた lock のコミットでは push の CI が動かないので、手で回せるようにする
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURITE: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;"

jobs:
  test:
    name: test (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Azurite（Azure Storage のエミュレーター）を起動
        run: |
          docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[aws,azure,dev]" pip-audit
      - run: .github/scripts/run.sh bash -c "ruff check . && ruff format --check ."
      - name: pytest（moto で AWS、Azurite で Azure を含む）
        env:
          RP_TEST_AZURITE: ${{ env.AZURITE }}
        run: .github/scripts/run.sh pytest -q -rs --cov=review_platform --cov-report=term-missing --cov-fail-under=85
      - name: 依存の脆弱性（pip-audit）
        run: .github/scripts/run.sh pip-audit --skip-editable --progress-spinner off
      - name: 性能の目安（ローカル実装、LLM は fake. 合否は付けず Job Summary に書く）
        if: matrix.python == '3.12'
        run: python scripts/bench_local.py --jobs 100 >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: 秘密情報の混入検査（gitleaks）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 履歴のすべてを調べる
          persist-credentials: false
      - name: gitleaks（すべてのコミット）
        run: |
          .github/scripts/run.sh docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git --config .gitleaks.toml --redact --no-banner -v .

  test-windows:
    name: test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[aws,dev]"
      - run: bash .github/scripts/run.sh pytest -q -rs

  terraform:
    name: terraform (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure]
    defaults:
      run:
        working-directory: infra/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      - run: ../../.github/scripts/run.sh terraform fmt -check -recursive
      - run: ../../.github/scripts/run.sh terraform init -backend=false -input=false -lockfile=readonly
      - run: ../../.github/scripts/run.sh terraform validate -no-color
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: ../../.github/scripts/run.sh tflint --format compact

  iac-scan:
    name: IaC のセキュリティ検査（trivy config）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
          output: trivy-config.txt
      - if: always()
        run: cat trivy-config.txt
      - if: failure()
        run: grep -E "^(AVD|AWS|AZU|KSV|DS)-|HIGH|CRITICAL|^ *[a-z_]+\.tf:[0-9]" trivy-config.txt | head -80 | sed 's/^/::error::/'

  e2e:
    name: e2e (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [local, aws, azure]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: scripts/e2e.sh ${{ matrix.profile }}
      - if: failure()
        run: tail -200 e2e-${{ matrix.profile }}.log | sed 's/^/::error::/' | tail -60
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-${{ matrix.profile }}
          path: e2e-*.log
          if-no-files-found: ignore

  image-scan:
    name: イメージの脆弱性（trivy image）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/run.sh docker build -t review-platform:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: review-platform:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
          output: trivy-image.txt
      - if: always()
        run: cat trivy-image.txt || true
      - if: failure()
        run: grep -E "HIGH|CRITICAL|CVE-" trivy-image.txt | head -80 | sed 's/^/::error::/'
