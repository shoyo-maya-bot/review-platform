name: terraform-lock

# Terraform の lock ファイル（.terraform.lock.hcl）を作り直してコミットする.
# プロバイダーの版の範囲（versions.tf）を変えたときと、手で動かしたときだけ動く.
# Windows・macOS・Linux のどれで init しても同じ lock になるよう、各 OS のハッシュを入れる.
on:
  push:
    branches: [main]
    paths:
      - "infra/*/versions.tf"
      - ".github/workflows/terraform-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-lock
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # lock ファイルをコミットするため（このジョブだけ）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      - name: lock を作る
        run: |
          # 古い lock があると、版の範囲を上げたとき「locked provider ... does not match」で失敗する.
          # 範囲の中で最新の版を選び直すため、いったん消してから作る.
          for d in infra/aws infra/azure; do
            rm -f "$d/.terraform.lock.hcl"
            terraform -chdir="$d" providers lock \
              -platform=linux_amd64 -platform=linux_arm64 \
              -platform=windows_amd64 -platform=darwin_amd64 -platform=darwin_arm64
          done
      - name: 変わっていればコミット
        run: |
          git add infra/*/.terraform.lock.hcl
          if git diff --cached --quiet; then
            echo "lock は変わっていません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: Terraform の lock ファイルを更新"
          git pull --rebase && git push
