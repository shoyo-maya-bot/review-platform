version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      python: { patterns: ["*"] }
    ignore:
      # mcp の次の大きな版（3.x）は API が変わりうるため、移行は手作業で行う
      - dependency-name: mcp
        versions: [">=3"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: terraform
    directories: ["/infra/aws", "/infra/azure"]
    schedule: { interval: monthly }
