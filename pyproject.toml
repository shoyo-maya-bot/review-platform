[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-platform"
version = "0.1.0"
description = "設計書とコードの差分を AI でレビューする基盤（API・ワーカー・MCP）。ローカル・AWS・Azure で同じコードが動く"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40,<2",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.8,<3",
  "pyyaml>=6,<7",
  "mcp>=2,<3",
  # 差分のレビュー（振り分け・検証・結果の読み取り）. agent-lab の auto-review をコミット SHA で固定
  "auto-review @ git+https://github.com/shoyo-maya-bot/agent-lab.git@08e9689d111007d21cc16179edb8db70ecbe6e88#subdirectory=auto-review",
  # LLM の呼び出し（再試行・料金表・伏せ字）. devtools-common をコミット SHA で固定（auto-review と同じ SHA にそろえる.
  # 違う SHA にすると pip が解決できない）
  "devtools-common @ git+https://github.com/shoyo-maya-bot/devtools-common.git@04f3915ab696d9312f1526dd11d5178dcd2601eb",
]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
azure = ["azure-storage-blob>=12.19,<13", "azure-storage-queue>=12.9,<13", "azure-data-tables>=12.5,<13", "azure-identity>=1.15,<2"]
# 設計書の変換（doc2md）. ローカルで動かすとき用（pip install -e ".[tools]"）. doc-to-markdown（a10ad87）が固定している devtools-common（04f3915）は、
# 上の auto-review・devtools-common と同じ SHA なので、このパッケージと同じ venv に入る（SHA がずれると pip・uv が解決できない）.
# イメージでは別の venv（/opt/doc2md）に入れる（Dockerfile の DOC2MD_REF. この SHA と同じにする: tests/test_pins.py が確かめる）
tools = ["doc-to-markdown @ git+https://github.com/shoyo-maya-bot/doc-to-markdown.git@a10ad8737ccb6bac6271ef67cef4d9c9ff0edfce"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "moto[s3,sqs,dynamodb]>=5,<6"]

[project.scripts]
review-platform = "review_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_platform = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "aws: moto で AWS の実装を試す（boto3 と moto が要る）",
  "azure: Azurite で Azure の実装を試す（RP_TEST_AZURITE に接続文字列）",
]

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "BLE"]
ignore = ["S101", "S603", "S607", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S108", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["review_platform", "conftest", "contract"]
